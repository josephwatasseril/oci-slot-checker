name: Check OCI Appointment Slots

on:
  workflow_dispatch:

concurrency:
  group: oci-checker
  cancel-in-progress: true

jobs:
  check-slots:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-jammy

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install Python Packages
        run: pip install -r requirements.txt

      - name: Restore State Cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: oci-state-${{ github.run_id }}
          restore-keys: |
            oci-state-

      - name: Run OCI Checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          START_DATE: ${{ vars.START_DATE }}
          CUTOFF_DATE: ${{ vars.CUTOFF_DATE }}
          EXCLUDED_DATES: ${{ vars.EXCLUDED_DATES }}
          PREFERRED_SLOT_COUNT: ${{ vars.PREFERRED_SLOT_COUNT }}
          HEARTBEAT_START_HOUR: ${{ vars.HEARTBEAT_START_HOUR }}
          HEARTBEAT_END_HOUR: ${{ vars.HEARTBEAT_END_HOUR }}
          MAX_RETRIES: ${{ vars.MAX_RETRIES }}
        run: python oci_watcher.py

      - name: Upload Run Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-screenshots
          path: "*.png"
          retention-days: 1

      - name: Prune Caches Older Than 1 Hour
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # 1. Resolve latest version tag from GitHub's release redirect
          LATEST_TAG=$(basename $(curl -fs -o /dev/null -w %{redirect_url} https://github.com/cli/cli/releases/latest))
          VERSION="${LATEST_TAG#v}"

          # 2. Download and extract directly into /usr/local (bin/gh -> /usr/local/bin/gh)
          curl -fsSL "https://github.com/cli/cli/releases/download/${LATEST_TAG}/gh_${VERSION}_linux_amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local

          # 3. Prune old cache entries
          CUTOFF=$(date -u -d '1 hour ago' +%s)
          gh api "/repos/$REPO/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith("oci-state-")) | select(((.created_at[0:19] + "Z") | fromdateiso8601) < '$CUTOFF') | .id' \
          | while read -r cache_id; do
            echo "Deleting old cache ID: $cache_id"
            gh api --method DELETE "/repos/$REPO/actions/caches/$cache_id"
          done
