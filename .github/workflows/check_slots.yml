name: Check OCI Appointment Slots

on:
  workflow_dispatch:

concurrency:
  group: oci-checker
  cancel-in-progress: true

jobs:
  check-slots:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Packages
        run: pip install -r requirements.txt

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Restore State Cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: oci-state-${{ github.run_id }}
          restore-keys: |
            oci-state-

      - name: Run OCI Checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          START_DATE: ${{ vars.START_DATE }}
          CUTOFF_DATE: ${{ vars.CUTOFF_DATE }}
          EXCLUDED_DATES: ${{ vars.EXCLUDED_DATES }}
          PREFERRED_SLOT_COUNT: ${{ vars.PREFERRED_SLOT_COUNT }}
          HEARTBEAT_START_HOUR: ${{ vars.HEARTBEAT_START_HOUR }}
          HEARTBEAT_END_HOUR: ${{ vars.HEARTBEAT_END_HOUR }}
          MAX_RETRIES: ${{ vars.MAX_RETRIES }}
        run: python oci_watcher.py

      - name: Upload Run Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-screenshots
          path: "*.png"
          retention-days: 1

      - name: Prune Caches Older Than 1 Hour
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Calculate UTC cutoff epoch (1 hour ago)
          CUTOFF=$(date -u -d '1 hour ago' +%s)

          # Fetch cache list and parse IDs older than 1 hour matching key 'oci-state-'
          gh api "/repos/$REPO/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith("oci-state-")) | select((.created_at | fromdateiso8601) < '$CUTOFF') | .id' \
          | while read -r cache_id; do
            echo "Deleting old cache ID: $cache_id"
            gh api --method DELETE "/repos/$REPO/actions/caches/$cache_id"
          done
